name: Reference data and plotting checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check saved reference datasets
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regenerate figures in a temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/lh2-results"
          cp results/*.mat "$RUNNER_TEMP/lh2-results/"
          python python/plot_vaporizer_results.py --directory "$RUNNER_TEMP/lh2-results"
